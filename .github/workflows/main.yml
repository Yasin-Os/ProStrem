name: Build ProStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Release Build Info into strings.xml
        shell: bash
        run: |
          cat << 'XML_EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ProStream</string>
              <string name="github_repo">${{ github.repository }}</string>
              <string name="build_number">${{ github.run_number }}</string>
              <string name="app_version">2.0.${{ github.run_number }}</string>
          </resources>
          XML_EOF
          sed -i "s|\${{ github.repository }}|${{ github.repository }}|g" app/src/main/res/values/strings.xml
          sed -i "s|\${{ github.run_number }}|${{ github.run_number }}|g" app/src/main/res/values/strings.xml
          cat app/src/main/res/values/strings.xml

      - name: Build Android APK
        uses: tyron12233/CodeAssist@main
        with:
          variant: debug
          artifact-name: ProStream-debug

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: ProStream-debug
          path: ./apk

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find ./apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            find ./apk -type f
            exit 1
          fi

          cp "$APK" ./ProStream.apk

          echo "APK ready:"
          ls -lh ./ProStream.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"

          gh release create "$TAG"             ./ProStream.apk#ProStream.apk             --title "ProStream Build ${{ github.run_number }}"             --notes "Automatic ProStream APK build (#${{ github.run_number }}) with In-App Updater."             --latest
