name: Build ProStream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Release Build Info into strings.xml
        shell: bash
        env:
          REPO_NAME: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          cat << XML_EOF > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ProStream</string>
              <string name="github_repo">${REPO_NAME}</string>
              <string name="build_number">${RUN_NUM}</string>
              <string name="app_version">2.0.${RUN_NUM}</string>
          </resources>
          XML_EOF
          cat app/src/main/res/values/strings.xml

      - name: Build Android APK
        uses: tyron12233/CodeAssist@main
        with:
          variant: debug
          artifact-name: ProStream-debug

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: ProStream-debug
          path: ./apk

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find ./apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            find ./apk -type f
            exit 1
          fi

          cp "$APK" ./ProStream.apk

          echo "APK ready:"
          ls -lh ./ProStream.apk

      - name: Sign APK with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore configured — keeping debug signature."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APKSIGNER=""
          for DIR in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk" /opt/android-sdk /usr/lib/android-sdk; do
            [ -n "$DIR" ] || continue
            FOUND=$(find "$DIR" -maxdepth 4 -name apksigner -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then APKSIGNER="$FOUND"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found — keeping debug signature."
            rm -f /tmp/release.keystore
            exit 0
          fi
          "$APKSIGNER" sign --ks /tmp/release.keystore --ks-pass "pass:$KEY_STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --ks-key-alias "$KEY_ALIAS" --out /tmp/ProStream-signed.apk ./ProStream.apk
          "$APKSIGNER" verify --verbose /tmp/ProStream-signed.apk
          mv /tmp/ProStream-signed.apk ./ProStream.apk
          rm -f /tmp/release.keystore
          echo "APK signed with release keystore."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"

          gh release create "$TAG" \
            ./ProStream.apk#ProStream.apk \
            --title "ProStream Build ${{ github.run_number }}" \
            --notes "Automatic ProStream APK build (#${{ github.run_number }}), signed with the release keystore." \
            --latest
